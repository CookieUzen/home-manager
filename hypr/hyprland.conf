# Hyprland config — migrated from niri (scrolling layout + vim-style binds)
# Old dwindle config backed up in git.

# Monitors (taken from KDE kwinoutputconfig.json)
# 4K Gigabyte MO27U2 — HDR, VRR, top-right (laptop logical width at scale 1.7 ≈ 1694px)
monitorv2 {
    output = DP-2
    mode = 3840x2160@240
    position = 1728x0
    scale = 1.5
    cm = hdr
    bitdepth = 10
    vrr = 1
    sdrbrightness = 1.35
}

# Laptop OLED — HDR, lower-left
monitorv2 {
    output = eDP-1
    mode = 2880x1800@60
    position = 0x1310
    scale = 1.7
    cm = hdr
    bitdepth = 10
    vrr = 1
    sdrbrightness = 1.3
}

# Fallback
monitor = , preferred, auto, 1

# Execute programs on launch
# exec-once = waybar    # alt bar
exec-once = nm-applet   # WiFi applet
exec-once = fcitx5      # Input method

# Software cursor in HDR mode — hardware cursors skip tone mapping and
# render ~4x brighter than the tone-mapped desktop
cursor {
    no_hardware_cursors = 1
}

# Input settings
input {
    kb_options = ctrl:nocaps
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
    sensitivity = 0
}

# General settings
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = scrolling
}

# Scrolling layout (niri-style infinite tape)
scrolling {
    column_width = 0.5
    # 0 = center focused column (less aggressive than 1 = fit)
    focus_fit_method = 0
    # only auto-scroll when window is mostly offscreen
    follow_min_visible = 0.6
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
    wrap_focus = true
    wrap_swapcol = true
}

# Decoration settings
decoration {
    rounding = 4
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = yes
        offset = 0 2
        range = 10
        render_power = 2
    }
}

# Animations
animations {
    enabled = yes
    # original animation style, durations slowed ~20%
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 8, myBezier
    animation = windowsMove, 1, 6, default
    animation = windowsOut, 1, 8, default, popin 80%
    animation = border, 1, 12, default
    animation = fade, 1, 8, default
    animation = workspaces, 1, 7, default
}

# gestures: removed — workspace_swipe moved/disabled in 0.56
# Variables
$terminal = alacritty
$mod = ALT

### Window navigation (vim hjkl) — niri: focus-column-left-or-last / focus-window-up/down
bind = $mod, h, layoutmsg, focus l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, layoutmsg, focus r

### Move windows (vim hjkl with Shift) — niri: move-column / move-window-up-down
bind = $mod SHIFT, h, layoutmsg, swapcol l
bind = $mod SHIFT, l, layoutmsg, swapcol r
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u

### Consume / expel — niri: consume-or-expel-window-left/right
bind = $mod CTRL, h, layoutmsg, consume_or_expel prev
bind = $mod CTRL, l, layoutmsg, consume_or_expel next

### Monitors — niri: focus-monitor-left/right, move-window-to-monitor-*
bind = $mod, e, focusmonitor, +1
bind = $mod, q, focusmonitor, -1
bind = $mod CTRL, e, movewindow, r   # crosses monitors
bind = $mod CTRL, q, movewindow, l   # crosses monitors

### Window operations
bind = $mod SHIFT, q, killactive
bind = $mod, f, fullscreen, 1        # windowed fullscreen (niri toggle-windowed-fullscreen)
bind = $mod SHIFT, f, fullscreen, 0  # true fullscreen (layout-aware on scrolling)
bind = $mod SHIFT, i, togglefloating
bind = $mod, i, cyclenext, floating  # approx of switch-focus-between-floating-and-tiling

### Maximize / resize columns — niri: maximize-column / switch-preset-column-width
bind = $mod, o, layoutmsg, fit expand
bind = $mod CTRL, o, layoutmsg, colresize +conf

### Scroll the tape — niri moves with the focus; explicit scroll here
bind = $mod CTRL, period, layoutmsg, move +col
bind = $mod CTRL, comma, layoutmsg, move -col

### Workspaces (vim numbers)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

### Launchers / apps
bind = $mod, return, exec, $terminal
bind = $mod, space, exec, dms ipc spotlight toggle

### DMS controls (as in niri.nix)
bind = $mod, N, exec, dms ipc notifications toggle
bind = $mod, Comma, exec, dms ipc settings toggle
bind = $mod, P, exec, dms ipc notepad toggle
bind = $mod, V, exec, dms ipc clipboard toggle
bind = $mod, M, exec, dms ipc processlist toggle
bind = $mod, X, exec, dms ipc powermenu toggle
bind = $mod ALT, N, exec, dms ipc night toggle
bind = SUPER ALT, L, exec, dms ipc lock lock

### Media keys
bind = , XF86AudioRaiseVolume, exec, dms ipc audio increment 3
bind = , XF86AudioLowerVolume, exec, dms ipc audio decrement 3
bind = , XF86AudioMute, exec, dms ipc audio mute
bind = , XF86AudioMicMute, exec, dms ipc audio micmute
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

### Brightness keys
bind = , XF86MonBrightnessUp, exec, dms ipc brightness increment 5 ""
bind = , XF86MonBrightnessDown, exec, dms ipc brightness decrement 5 ""

### Move/resize windows with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

debug {
    disable_logs = false
}