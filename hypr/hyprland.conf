# Monitor configuration
monitor = eDP-1, 2256x1504@60,0x0,1.56667
monitor = DP-1, 3840x2160@144,auto-right,1.5
monitor = HDMI-A-1, 3440x1440@99.99Hz, 0x0, 1
monitor = , preferred, auto, 1

# Execute programs on launch
exec-once = waybar      # Bar!
exec-once = nm-applet   # WiFi applet
exec-once = fcitx5      # Input method

# Input settings
input {
    kb_options = ctrl:nocaps
    follow_mouse = 1 # Example: if you want this
    touchpad {
        natural_scroll = no # Example
    }
    sensitivity = 0 # Example: -1.0 - 1.0, 0 means no change
}

# General settings
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle # or master
}

# Decoration settings
decoration {
    rounding = 4
    blur {
        enabled = true
        size = 3 # Adjust blur size
        passes = 1 # Adjust blur passes
        # new_optimizations = on # Hyprland 0.36+
    }
    shadow {
        enabled = yes
        offset = 0 2      # Example: x y offset
        range = 10        # Example: shadow spread
        render_power = 2  # Example: 1 (sharp) to 3 (diffuse)
    }
}

# Animations (example, enable as you like)
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Dwindle layout (if used)
dwindle {
    pseudotile = yes
    preserve_split = yes
}

# Gestures (example)
gestures {
    workspace_swipe = off
}

# Variables
$terminal = alacritty
$browser = app.zen_browser.zen
$launcher = wofi --show drun
$mod = ALT

# Keybinds
bind = $mod, r, exec, $browser
bind = $mod, return, exec, $terminal
bind = $mod, w, exec, $launcher
bind = $mod, q, killactive,
bind = $mod SHIFT, e, exit,
bind = $mod, f, fullscreen, 1
bind = $mod SHIFT,  f, fullscreen
bind = $mod, space, togglefloating,
bind = $mod, p, pseudo, # dwindle

# Move focus with $mod + hjkl
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move window with $mod + SHIFT + hjkl
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# Workspace binds
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10 # Example for workspace 10

# Move active window to a workspace with $mod + SHIFT + N
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10 # Example

# Scroll through existing workspaces with $mod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media keys
bind = $mod, XF86AudioPlay, exec, playerctl play-pause
bind = $mod, XF86AudioNext, exec, playerctl next
bind = $mod, XF86AudioPrev, exec, playerctl previous
bind = $mod, XF86AudioStop, exec, playerctl stop

# Brightness keys
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Volume keys
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

# Window rules (example)
# windowrulev2 = float,class:^(pavucontrol)$
# windowrulev2 = float,title:^(nm-connection-editor)$

debug {
    disable_logs = false
}
